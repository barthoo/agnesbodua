<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preload" as="image" href="17.jpg">
  <title>Celebrating the Life of Obaapanin Agnes Bodua</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { width:100%; height:100%; overflow:hidden }
    body{background:linear-gradient(180deg,#2a1c00,#c99700);display:flex;align-items:center;justify-content:center;font-family:system-ui,Segoe UI,Roboto,Arial}
    .screen{width:100vw;height:100svh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .card{display:flex;flex-direction:column;align-items:center;gap:12px}
    .img-wrap{width:100%;max-width:900px;height:60vh;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
    img{max-width:100%;max-height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .32s ease}
    img.loaded{opacity:1}
    .spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,0.12);border-top-color:rgba(212,175,55,0.95);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .nav{display:flex;gap:12px;margin-top:8px;justify-content:center}
    .btn{display:inline-block;padding:8px 12px;background:rgba(0,0,0,0.6);color:#fff;border-radius:8px;text-decoration:none;border:2px solid rgba(212,175,55,0.9);font-weight:600}
    .btn:active{transform:translateY(1px)}
  </style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="img-wrap"><div class="spinner"></div><img src="c.png" alt="Celebrating the life of Obaapanin Agnes Bodua" decoding="async" onload="this.classList.add('loaded'); this.previousElementSibling.style.display='none'" width="1200" height="800"></div>
      <div class="nav">
        <a class="btn" href="table_of_content.html">Click here to continue</a>
      </div>
    </div>
  </div>
</body>

</html>
